<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SignalGit — El Radar de Código Real</title>
  <!-- Usa el CSS compilado por Actions para máxima velocidad -->
  <link href="output.css?v=7e97eab6" rel="stylesheet">
</head>
<body class="bg-bgDark text-gray-200 min-h-screen font-sans antialiased">
  <div class="max-w-6xl mx-auto px-4 py-8">

    <!-- Encabezado -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center pb-6 border-b border-borderDark gap-4">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-white flex items-center gap-2">
          ⚡ SignalGit
        </h1>
        <p class="text-sm text-gray-400 mt-1">
          Detectando repositorios reales antes de que se vuelvan mainstream.
        </p>
      </div>
      <div id="last-update" class="text-xs text-gray-500 font-mono bg-[#161b22] px-3 py-1.5 rounded-md border border-borderDark">
        Actualizando datos...
      </div>
    </header>

    <!-- Controles y Filtros -->
    <div class="mt-6 space-y-4">
      <div class="flex flex-col md:flex-row gap-3 justify-between">
        <div class="flex flex-wrap gap-2">
          <button data-filter="all" class="filter-btn active px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white border border-blue-500 transition">🔥 Top Crecimiento</button>
          <button data-filter="gems" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-transparent text-gray-300 border border-borderDark hover:bg-gray-800 transition">💎 Gemas Ocultas</button>
        </div>

        <div class="flex flex-wrap gap-2 w-full md:w-auto">
          <select id="sort-select" aria-label="Ordenar por" class="bg-[#161b22] border border-borderDark text-xs rounded-lg px-3 py-2 text-gray-300 focus:outline-none focus:border-blue-500">
            <!-- Opciones inyectadas via JS desde sort.js -->
          </select>
          <select id="age-select" class="bg-[#161b22] border border-borderDark text-xs rounded-lg px-3 py-2 text-gray-300 focus:outline-none focus:border-blue-500">
            <option value="all">Cualquier edad</option>
            <option value="new">Nuevos (&lt; 7 días)</option>
            <option value="recent">Recientes (&lt; 30 días)</option>
          </select>
          <select id="lang-select" class="bg-[#161b22] border border-borderDark text-xs rounded-lg px-3 py-2 text-gray-300 focus:outline-none focus:border-blue-500">
            <option value="all">Todos los lenguajes</option>
          </select>
          <input type="text" id="search-input" placeholder="Buscar... (ej. stars:>100)" class="bg-[#161b22] border border-borderDark text-xs rounded-lg px-3 py-2 text-gray-300 placeholder-gray-500 focus:outline-none focus:border-blue-500 w-full md:w-48" />
        </div>
      </div>

      <!-- Nube de Tópicos -->
      <div class="flex items-center gap-2 overflow-x-auto pb-2 no-scrollbar" id="topics-container">
        <span class="text-xs text-gray-500 font-medium whitespace-nowrap">Tendencias:</span>
        <!-- Botones inyectados vía JS -->
      </div>
    </div>

    <!-- Alcance del conjunto y criterio activo -->
    <p id="scope-note" class="mt-4 text-[11px] text-gray-500 leading-relaxed"></p>

    <!-- Feed de Proyectos -->
    <main id="repo-grid" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Inyección dinámica -->
    </main>
  </div>

  <script src="sort.js?v=d917f2b2"></script>
  <script src="app.js?v=baabd439"></script>
</body>
</html>
